<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e7e2">
  <title>AeroSpace keyboard map</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="mode-switch" role="tablist" aria-label="Binding mode">
      <button class="active" data-mode="main">Main <b></b></button>
      <button data-mode="service">Service <b></b></button>
    </div>
    <div id="keyboard" class="keyboard" aria-label="AeroSpace keyboard shortcut map"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
